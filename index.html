<!doctype html>
<html lang="es" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Video a MP3</title>
<meta name="description" content="Convierte videos a MP3 directamente en tu navegador.">
<style>
:root{color-scheme:light;--bg:#f5f5f7;--surface:#fff;--surface2:#ebefe8;--text:#161a14;--muted:#697065;--line:rgba(22,26,20,.10);--brand:#8aa07c;--brand2:#5b7350;--soft:rgba(138,160,124,.18);--shadow:0 1px 2px rgba(22,26,20,.04),0 18px 50px rgba(22,26,20,.08)}
html[data-resolved="dark"]{color-scheme:dark;--bg:#090a09;--surface:#181b16;--surface2:#242820;--text:#edf0ea;--muted:#9aa194;--line:rgba(237,240,234,.11);--brand:#9aae8d;--brand2:#8aa07c;--soft:rgba(138,160,124,.20);--shadow:0 1px 2px rgba(0,0,0,.45),0 20px 60px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}body{transition:.22s background,.22s color}.wrap{max-width:760px;margin:auto;padding:22px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(150deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 8px 25px rgba(91,115,80,.25)}.logo svg{width:25px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.brand h1{font-family:Georgia,serif;font-size:23px;margin:0;letter-spacing:-.03em}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.seg{display:flex;padding:3px;background:var(--surface2);border-radius:12px;gap:2px}.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:7px 10px;font:600 12px inherit;cursor:pointer}.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.drop{min-height:390px;border:1.7px dashed rgba(138,160,124,.65);border-radius:20px;display:grid;place-items:center;padding:34px 22px;text-align:center;cursor:pointer;transition:.18s}.drop:hover,.drop.drag{background:var(--soft);border-color:var(--brand2);transform:translateY(-1px)}.drop.busy{cursor:default}.dropin{max-width:430px}.ico{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--soft);color:var(--brand2);display:grid;place-items:center}.ico svg{width:38px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.drop h2{font-size:23px;margin:0 0 8px;letter-spacing:-.03em}.drop p{margin:0;color:var(--muted);font-size:14px}.choose{display:inline-flex;margin-top:20px;padding:12px 18px;border-radius:13px;background:linear-gradient(#6a8360,#526a47);color:white;font-weight:700;font-size:14px;box-shadow:inset 0 1px rgba(255,255,255,.2),0 7px 18px rgba(82,106,71,.22)}.note{font-size:12px!important;margin-top:18px!important}.status{display:none;margin-top:22px}.status.show{display:block}.filename{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:12px;color:var(--muted);margin-top:4px}.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:16px}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:inherit;transition:width .15s}.again{display:none;margin-top:16px;border:1px solid var(--line);background:var(--surface2);color:var(--text);padding:10px 14px;border-radius:11px;font-weight:650;cursor:pointer}.again.show{display:inline-flex}.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px}.overlay{position:fixed;inset:12px;display:grid;place-items:center;border:2px dashed var(--brand);border-radius:28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;transition:.15s;z-index:20;font-size:20px;font-weight:750}.dragging .overlay{opacity:1;visibility:visible}@media(max-width:620px){.top{align-items:flex-start}.brand p{display:none}.seg button{padding:7px 8px}.card{padding:12px}.drop{min-height:430px}.drop h2{font-size:21px}}
</style>
</head>
<body>
<div class="overlay">Suelta el video aquí</div>
<main class="wrap">
<header class="top">
<div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></div><div><h1>Video a MP3</h1><p>Rápido, privado y directo</p></div></div>
<div class="seg" aria-label="Tema"><button data-theme="light">Claro</button><button data-theme="dark">Oscuro</button><button data-theme="system">Sistema</button></div>
</header>
<section class="card">
<div class="drop" id="drop" role="button" tabindex="0">
<div class="dropin">
<div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v12m0-12 4 4m-4-4L8 7"/><path d="M5 14v5h14v-5"/><path d="M7 10 4 8v8l3-2m10-4 3-2v8l-3-2"/></svg></div>
<h2 id="title">Arrastra un video</h2>
<p id="message">Se convertirá a MP3 y se descargará automáticamente.</p>
<span class="choose" id="choose">Elegir video</span>
<p class="note">El archivo no sale de tu dispositivo.</p>
<div class="status" id="status"><div class="filename" id="filename"></div><div class="sub" id="sub"></div><div class="bar"><i id="progress"></i></div></div>
<button class="again" id="again" type="button">Convertir otro video</button>
</div>
</div>
<input id="file" type="file" accept="video/*,.mkv,.avi,.mov,.webm,.mp4,.m4v" hidden>
</section>
<p class="foot">La conversión se realiza en el navegador mediante FFmpeg.</p>
</main>
<script type="module">
import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';
const $=s=>document.querySelector(s),fileInput=$('#file'),drop=$('#drop'),title=$('#title'),message=$('#message'),choose=$('#choose'),status=$('#status'),filename=$('#filename'),sub=$('#sub'),progress=$('#progress'),again=$('#again');
let working=false,ffmpeg;
const media=matchMedia('(prefers-color-scheme: dark)');
function setTheme(t){localStorage.setItem('videoMp3Theme',t);document.documentElement.dataset.theme=t;document.documentElement.dataset.resolved=t==='system'?(media.matches?'dark':'light'):t;document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===t));}
setTheme(localStorage.getItem('videoMp3Theme')||'system');media.addEventListener('change',()=>{if(document.documentElement.dataset.theme==='system')setTheme('system')});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=e=>{e.stopPropagation();setTheme(b.dataset.theme)});
function fmt(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
async function loadFFmpeg(){if(ffmpeg?.loaded)return;sub.textContent='Preparando el conversor…';progress.style.width='6%';ffmpeg=new FFmpeg();ffmpeg.on('progress',({progress:p})=>{progress.style.width=Math.max(8,Math.min(99,p*100))+'%';sub.textContent='Convirtiendo… '+Math.round(p*100)+'%'});const base='https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';await ffmpeg.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')});}
async function convert(f){if(working||!f)return;if(!f.type.startsWith('video/')&&!/\.(mp4|mov|mkv|avi|webm|m4v|mpeg|mpg|3gp)$/i.test(f.name)){alert('Selecciona un archivo de video.');return}working=true;drop.classList.add('busy');title.textContent='Convirtiendo a MP3';message.textContent='No cierres esta página durante el proceso.';choose.style.display='none';status.classList.add('show');again.classList.remove('show');filename.textContent=f.name;sub.textContent=fmt(f.size);progress.style.width='2%';try{await loadFFmpeg();const ext=(f.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,'');const input='entrada.'+ext,output='audio.mp3';await ffmpeg.writeFile(input,await fetchFile(f));await ffmpeg.exec(['-i',input,'-vn','-codec:a','libmp3lame','-q:a','2',output]);const data=await ffmpeg.readFile(output);const blob=new Blob([data.buffer],{type:'audio/mpeg'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.name.replace(/\.[^.]+$/,'')+'.mp3';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);await ffmpeg.deleteFile(input);await ffmpeg.deleteFile(output);progress.style.width='100%';title.textContent='MP3 descargado';message.textContent='La conversión terminó correctamente.';sub.textContent='Descarga completada';again.classList.add('show')}catch(err){console.error(err);title.textContent='No se pudo convertir';message.textContent='Prueba con otro video o un archivo más pequeño.';sub.textContent='El navegador no pudo completar el proceso.';progress.style.width='0';again.classList.add('show')}finally{working=false;drop.classList.remove('busy');fileInput.value=''}}
drop.onclick=()=>{if(!working)fileInput.click()};drop.onkeydown=e=>{if(!working&&(e.key==='Enter'||e.key===' ')){e.preventDefault();fileInput.click()}};fileInput.onchange=e=>convert(e.target.files[0]);again.onclick=e=>{e.stopPropagation();title.textContent='Arrastra un video';message.textContent='Se convertirá a MP3 y se descargará automáticamente.';choose.style.display='inline-flex';status.classList.remove('show');again.classList.remove('show');progress.style.width='0';fileInput.click()};['dragenter','dragover'].forEach(x=>window.addEventListener(x,e=>{e.preventDefault();if(!working)document.body.classList.add('dragging')}));['dragleave','drop'].forEach(x=>window.addEventListener(x,e=>{e.preventDefault();if(x==='dragleave'&&e.relatedTarget)return;document.body.classList.remove('dragging')}));window.addEventListener('drop',e=>{if(!working)convert([...e.dataTransfer.files].find(f=>f.type.startsWith('video/'))||e.dataTransfer.files[0])});
</script>
</body></html>
