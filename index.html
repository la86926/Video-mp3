<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Video a MP3</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--card:#fff;--soft:#e9eee6;--text:#151914;--muted:#7f877b;--brand:#657d59;--line:rgba(20,25,20,.1)}
html.dark{color-scheme:dark;--bg:#090a09;--card:#181b16;--soft:#252a22;--text:#eef1eb;--muted:#929a8d;--brand:#9aae8d;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(620px,100%)}.top{display:flex;justify-content:flex-end;margin-bottom:12px}.themes{display:flex;background:var(--card);border:1px solid var(--line);padding:3px;border-radius:12px}.themes button{border:0;background:transparent;color:var(--muted);width:34px;height:30px;border-radius:9px;cursor:pointer}.themes button.on{background:var(--soft);color:var(--text)}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px;box-shadow:0 20px 70px rgba(0,0,0,.09)}.drop{min-height:480px;border:1.7px dashed color-mix(in srgb,var(--brand) 68%,transparent);border-radius:22px;display:grid;place-items:center;text-align:center;cursor:pointer;transition:.18s;background:transparent}.drop:hover,.drop.drag{background:color-mix(in srgb,var(--soft) 75%,transparent)}.drop.busy{cursor:default}.inner{display:grid;justify-items:center;gap:18px}.icon{width:92px;height:92px;border-radius:30px;background:var(--soft);color:var(--brand);display:grid;place-items:center}.icon svg{width:46px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.name{max-width:440px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{width:min(330px,70vw);height:8px;background:var(--soft);border-radius:999px;overflow:hidden;display:none}.bar.show{display:block}.bar i{display:block;width:0;height:100%;background:var(--brand);transition:width .15s}.percent{font-size:12px;color:var(--muted);min-height:16px}.retry{display:none;border:0;background:var(--soft);color:var(--text);width:46px;height:46px;border-radius:14px;cursor:pointer}.retry.show{display:grid;place-items:center}.retry svg{width:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}input{display:none}.overlay{position:fixed;inset:12px;border:2px dashed var(--brand);border-radius:28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;transition:.15s;z-index:10}.dragging .overlay{opacity:1;visibility:visible}@media(max-width:600px){.drop{min-height:68vh}.icon{width:82px;height:82px}}
</style>
</head>
<body>
<div class="overlay"></div>
<main class="app">
<div class="top"><div class="themes"><button data-t="light" aria-label="Claro">☀</button><button data-t="dark" aria-label="Oscuro">☾</button><button data-t="system" aria-label="Sistema">◐</button></div></div>
<section class="card">
<div id="drop" class="drop" tabindex="0" role="button">
<div class="inner">
<div class="icon" id="icon"><svg viewBox="0 0 24 24"><path d="M12 3v12m0-12 4 4m-4-4L8 7"/><path d="M5 14v5h14v-5"/><path d="M7 10 4 8v8l3-2m10-4 3-2v8l-3-2"/></svg></div>
<div class="name" id="name"></div>
<div class="bar" id="bar"><i id="fill"></i></div>
<div class="percent" id="percent"></div>
<button class="retry" id="retry" aria-label="Intentar de nuevo"><svg viewBox="0 0 24 24"><path d="M20 6v6h-6"/><path d="M20 12a8 8 0 1 0 2 5.3"/></svg></button>
</div>
</div>
<input id="file" type="file" accept="video/*,.mp4,.m4v,.mov,.mkv,.webm,.avi,.flv,.wmv,.mpeg,.mpg,.3gp,.mts,.m2ts,.ts,.vob,.ogv,.divx,.rm,.rmvb">
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const $=s=>document.querySelector(s),drop=$('#drop'),input=$('#file'),nameEl=$('#name'),bar=$('#bar'),fill=$('#fill'),percent=$('#percent'),retry=$('#retry');
let busy=false,ffmpeg=null,lastFile=null;
const media=matchMedia('(prefers-color-scheme:dark)');
function theme(t){localStorage.setItem('v2m-theme',t);document.documentElement.classList.toggle('dark',t==='dark'||(t==='system'&&media.matches));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
theme(localStorage.getItem('v2m-theme')||'system');media.addEventListener('change',()=>theme(localStorage.getItem('v2m-theme')||'system'));document.querySelectorAll('[data-t]').forEach(b=>b.onclick=e=>{e.stopPropagation();theme(b.dataset.t)});
function reset(){busy=false;drop.classList.remove('busy');nameEl.textContent='';bar.classList.remove('show');fill.style.width='0';percent.textContent='';retry.classList.remove('show');input.value=''}
async function ensureFFmpeg(){
 if(ffmpeg&&ffmpeg.isLoaded())return;
 if(!window.FFmpeg)throw new Error('FFmpeg no cargó');
 const {createFFmpeg}=FFmpeg;
 ffmpeg=createFFmpeg({
  log:true,
  corePath:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
  progress:({ratio})=>{const p=Math.max(1,Math.min(99,Math.round((ratio||0)*100)));fill.style.width=p+'%';percent.textContent=p+'%'}
 });
 await ffmpeg.load();
}
async function convert(file){
 if(!file||busy)return;
 busy=true;lastFile=file;drop.classList.add('busy');nameEl.textContent=file.name;bar.classList.add('show');fill.style.width='2%';percent.textContent='2%';retry.classList.remove('show');
 try{
  await ensureFFmpeg();
  const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,8)||'bin';
  const inputName='input.'+ext,outputName='output.mp3';
  ffmpeg.FS('writeFile',inputName,await FFmpeg.fetchFile(file));
  await ffmpeg.run('-i',inputName,'-map','0:a:0','-vn','-c:a','libmp3lame','-b:a','320k','-id3v2_version','3',outputName);
  const data=ffmpeg.FS('readFile',outputName);
  const blob=new Blob([data.buffer],{type:'audio/mpeg'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=file.name.replace(/\.[^.]+$/,'')+'.mp3';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  try{ffmpeg.FS('unlink',inputName);ffmpeg.FS('unlink',outputName)}catch(_){ }
  fill.style.width='100%';percent.textContent='100%';
  setTimeout(reset,1200);
 }catch(err){
  console.error(err);fill.style.width='0';percent.textContent='×';retry.classList.add('show');busy=false;drop.classList.remove('busy');
 }
}
drop.onclick=()=>{if(!busy)input.click()};drop.onkeydown=e=>{if(!busy&&(e.key==='Enter'||e.key===' ')){e.preventDefault();input.click()}};input.onchange=e=>convert(e.target.files[0]);retry.onclick=e=>{e.stopPropagation();if(lastFile)convert(lastFile)};
['dragenter','dragover'].forEach(type=>window.addEventListener(type,e=>{e.preventDefault();if(!busy)document.body.classList.add('dragging')}));
['dragleave','drop'].forEach(type=>window.addEventListener(type,e=>{e.preventDefault();if(type==='dragleave'&&e.relatedTarget)return;document.body.classList.remove('dragging')}));
window.addEventListener('drop',e=>{const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)convert(f)});
</script>
</body>
</html>
