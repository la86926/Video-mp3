ntent='';bar.classList.remove('show');retry.classList.remove('show');progress(0);input.value=''}async function asBlobURL(urls,type){let error;for(const url of urls)try{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);return URL.createObjectURL(new Blob([await r.arrayBuffer()],{type}))}catch(e){error=e}throw error||Error('CDN')}async function load(){if(ffmpeg&&ffmpeg.loaded)return;stage='E1';if(!window.LocalFFmpeg)throw Error('client');ffmpeg=new LocalFFmpeg('./vendor/814.ffmpeg.js?v=4');ffmpeg.on('PROGRESS',({progress:p=0}={})=>progress(Math.max(8,Math.min(99,p*100))));const bases=['https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.9/dist/umd','https://unpkg.com/@ffmpeg/core@0.12.9/dist/umd'];stage='E2';progress(3);const coreURL=await asBlobURL(bases.map(x=>x+'/ffmpeg-core.js'),'text/javascript');stage='E3';progress(5);const wasmURL=await asBlobURL(bases.map(x=>x+'/ffmpeg-core.wasm'),'application/wasm');stage='E4';progress(8);await ffmpeg.load({coreURL,wasmURL})}async function del(p){try{await ffmpeg.deleteFile(p)}catch(_){}}async function convert(file){if(!file||busy)return;busy=true;lastFile=file;drop.classList.add('busy');nameEl.textContent=file.name;bar.classList.add('show');retry.classList.remove('show');progress(1);const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,10)||'bin',id=Date.now(),src='in-'+id+'.'+ext,out='out-'+id+'.mp3';try{await load();stage='E5';progress(10);await ffmpeg.writeFile(src,new Uint8Array(await file.arrayBuffer()));stage='E6';progress(12);const code=await ffmpeg.exec(['-hide_banner','-i',src,'-map','0:a:0','-vn','-ac','2','-c:a','libmp3lame','-b:a','320k','-id3v2_version','3',out]);if(code!==0)throw Error('ffmpeg '+code);stage='E7';const data=await ffmpeg.readFile(out),url=URL.createObjectURL(new Blob([data.buffer],{type:'audio/mpeg'})),a=document.createElement('a');a.href=url;a.download=(file.name.replace(/\.[^.]+$/,'')||'audio')+'.mp3';document.body.appendChild(a);a.click(
