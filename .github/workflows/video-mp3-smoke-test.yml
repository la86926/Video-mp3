name: Video MP3 smoke test

on:
  push:
    branches: [main]
    paths-ignore:
      - test-status.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Download sample video
        run: |
          curl -L --fail --retry 3 -o sample.webm https://raw.githubusercontent.com/ffmpegwasm/testdata/master/Big_Buck_Bunny_180_10s.webm
      - name: Test automatic MP3 download
        run: |
          python3 -m http.server 4173 >/tmp/video-mp3-server.log 2>&1 &
          cat > test.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();
            page.on('console', msg => console.log('BROWSER:', msg.type(), msg.text()));
            page.on('pageerror', err => console.error('PAGE ERROR:', err));
            await page.goto('http://127.0.0.1:4173/?test=1', { waitUntil: 'networkidle' });
            const downloadPromise = page.waitForEvent('download', { timeout: 240000 });
            await page.setInputFiles('#file', 'sample.webm');
            const download = await downloadPromise;
            const target = '/tmp/result.mp3';
            await download.saveAs(target);
            const size = fs.statSync(target).size;
            if (size < 1000) throw new Error(`MP3 demasiado pequeño: ${size}`);
            console.log(`MP3 OK: ${size} bytes`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node test.js
      - name: Save test result
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          printf '{"status":"%s","commit":"%s","run_id":"%s"}\n' "$TEST_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > test-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-status.json
          git commit -m "Registrar resultado prueba Video MP3 [skip ci]" || exit 0
          git push