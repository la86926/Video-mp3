name: Video MP3 smoke test

on:
  push:
    branches: [main]
    paths-ignore:
      - test-status.json
  workflow_dispatch:

permissions:
  contents: write

env:
  TEST_REVISION: 3

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser and FFmpeg
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create video with audio
        run: |
          ffmpeg -y -f lavfi -i color=c=black:s=320x240:d=2 -f lavfi -i sine=frequency=440:duration=2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac sample.mp4
      - name: Test automatic MP3 download
        run: |
          python3 -m http.server 4173 >/tmp/video-mp3-server.log 2>&1 &
          cat > test.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();
            page.on('console', msg => console.log('BROWSER:', msg.type(), msg.text()));
            page.on('pageerror', err => console.error('PAGE ERROR:', err));
            await page.goto('http://127.0.0.1:4173/?test=3', { waitUntil: 'networkidle' });
            const downloadPromise = page.waitForEvent('download', { timeout: 240000 });
            await page.setInputFiles('#file', 'sample.mp4');
            const download = await downloadPromise;
            const target = '/tmp/result.mp3';
            await download.saveAs(target);
            const size = fs.statSync(target).size;
            if (size < 1000) throw new Error(`MP3 demasiado pequeño: ${size}`);
            const header = fs.readFileSync(target).subarray(0, 3).toString('latin1');
            if (header !== 'ID3' && (fs.readFileSync(target)[0] !== 0xff)) throw new Error('El archivo descargado no parece MP3');
            console.log(`MP3 OK: ${size} bytes`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node test.js
      - name: Save test result
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          printf '{"status":"%s","commit":"%s","run_id":"%s","revision":"%s"}\n' "$TEST_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$TEST_REVISION" > test-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-status.json
          git commit -m "Registrar resultado prueba Video MP3 [skip ci]" || exit 0
          git push